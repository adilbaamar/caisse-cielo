name: iOS · Caisse Cielo (installation directe)
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
env:
  TEAM_ID: 9HG344VX7Z
  PROFILE_NAME: Caisse Cielo Dev
  SUPABASE_URL: https://stldyaglfdnnkoeamymd.supabase.co
  SUPABASE_KEY: sb_publishable_2htyi0ipMXT2dLWAsZ2grw_GS1PtfDt
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Projet Xcode (cible iOS 16.4 — requis par Tap to Pay)
        run: |
          npx cap add ios || true
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.4'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.4;/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "platform :ios" ios/App/Podfile
          npx cap sync ios
      - name: Réglages de l'app (Tap to Pay, permissions, icône)
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Requis par Apple pour accepter les paiements sans contact.'" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Requis pour les lecteurs de cartes Bluetooth.'" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Pour lire les codes QR.'" $P || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Caisse Cielo'" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Caisse Cielo'" $P
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $P || true
          cat > ios/App/App/App.entitlements <<'EOT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.proximity-reader.payment.acceptance</key><true/>
          </dict></plist>
          EOT
          # icône
          if [ -f icon-1024.png ]; then
            D=ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp icon-1024.png "$D/AppIcon-512@2x.png" 2>/dev/null || true
          fi
      - name: Certificat et profil de provisionnement
        env:
          P12: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -e
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security find-identity -v -p codesigning build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          curl -sS "$SUPABASE_URL/rest/v1/pos_fichiers?select=contenu&nom=eq.Caisse_Cielo_Dev.mobileprovision&order=created_at.desc&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            | python3 -c "import sys,json,base64;d=json.load(sys.stdin);sys.stdout.buffer.write(base64.b64decode(d[0]['contenu']))" > profile.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
      - name: Compilation (signature développement)
        run: |
          set -e
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath build/App.xcarchive archive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Manual IPHONEOS_DEPLOYMENT_TARGET=16.4 \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_ENTITLEMENTS=App/App.entitlements \
            PRODUCT_BUNDLE_IDENTIFIER=ca.cielomontreal.caisse \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" | xcpretty || true
          test -d build/App.xcarchive
          cat > ExportOptions.plist <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key><dict><key>ca.cielomontreal.caisse</key><string>$PROFILE_NAME</string></dict>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          EOT
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/out
          ls -la build/out
      - name: Page d'installation
        run: |
          set -e
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}")
          BASE="https://$OWNER.github.io/$REPO"
          mkdir -p site
          cp ios/App/build/out/*.ipa site/App.ipa
          cat > site/manifest.plist <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>$BASE/App.ipa</string></dict></array>
            <key>metadata</key><dict><key>bundle-identifier</key><string>ca.cielomontreal.caisse</string><key>bundle-version</key><string>1.0</string><key>kind</key><string>software</string><key>title</key><string>Caisse Cielo</string></dict>
          </dict></array></dict></plist>
          EOT
          sed "s#__MANIFEST__#itms-services://?action=download-manifest\&url=$BASE/manifest.plist#g" install.html > site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
