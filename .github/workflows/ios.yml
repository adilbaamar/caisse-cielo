name: iOS → App Store Connect
# Compile l'app Cielo (Capacitor) sur un Mac GitHub et l'envoie sur App Store Connect / TestFlight.
# Secrets requis (Settings → Secrets → Actions) : ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenu du fichier AuthKey_xxx.p8)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Xcode 26 (SDK iOS 26 requis par Apple)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Aucun Xcode 26 sur ce runner"; exit 1; fi
          sudo xcode-select -s "$X" && xcodebuild -version
      - name: Dépendances + projet iOS
        run: |
          npm install
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#7DA2BC' --iconBackgroundColorDark '#2f5068' --splashBackgroundColor '#eef6f9' --splashBackgroundColorDark '#172a36'
          npx cap sync ios
      - name: Numéro de build + équipe
        run: |
          BUILD=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Cielo" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 9HG344VX7Z;/g; s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'DEVELOPMENT_TEAM = 9HG344VX7Z' ios/App/App.xcodeproj/project.pbxproj || sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = 9HG344VX7Z;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Clé App Store Connect
        env: { ASC_KEY_P8: "${{ secrets.ASC_KEY_P8 }}", ASC_KEY_ID: "${{ secrets.ASC_KEY_ID }}" }
        run: |
          mkdir -p ~/private_keys
          python3 - <<'PY'
          import os,re,base64,textwrap
          raw=os.environ['ASC_KEY_P8'].strip()
          body=re.sub(r'\s+','',re.sub(r'-----(BEGIN|END)[^-]*-----','',raw))
          if not body.startswith('MIG'):
              try: body=re.sub(r'\s+','',re.sub(r'-----(BEGIN|END)[^-]*-----','',base64.b64decode(body).decode()))
              except Exception: pass
          pem='-----BEGIN PRIVATE KEY-----\n'+'\n'.join(textwrap.wrap(body,64))+'\n-----END PRIVATE KEY-----\n'
          open(os.path.expanduser('~/private_keys/AuthKey_'+os.environ['ASC_KEY_ID']+'.p8'),'w').write(pem)
          print('cle ecrite,', len(body), 'caracteres base64')
          PY
          openssl pkey -in ~/private_keys/AuthKey_$ASC_KEY_ID.p8 -noout && echo "PEM valide"
      - name: Compilation + envoi TestFlight (fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: fastlane ios beta
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-build, path: build, if-no-files-found: ignore }
