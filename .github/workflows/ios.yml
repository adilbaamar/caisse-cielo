name: iOS → App Store Connect
# Compile l'app Cielo (Capacitor) sur un Mac GitHub et l'envoie sur App Store Connect / TestFlight.
# Secrets requis (Settings → Secrets → Actions) : ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenu du fichier AuthKey_xxx.p8)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Xcode 26 (SDK iOS 26 requis par Apple)
        run: |
          if xcodebuild -version | grep -q "Xcode 26"; then xcodebuild -version; exit 0; fi
          X=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode-26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Aucun Xcode 26 sur ce runner"; exit 1; fi
          sudo xcode-select -s "$X" && xcodebuild -version
      - name: Dépendances + projet iOS
        run: |
          npm install
          npx cap add ios --packagemanager CocoaPods
          npx @capacitor/assets generate --ios --iconBackgroundColor '#7DA2BC' --iconBackgroundColorDark '#2f5068' --splashBackgroundColor '#eef6f9' --splashBackgroundColorDark '#172a36'
          npx cap sync ios
      - name: Numéro de build + équipe
        run: |
          BUILD=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.3" ios/App/App/Info.plist || true
          sed -i '' 's/MARKETING_VERSION = 1.0;/MARKETING_VERSION = 1.3;/g' ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Cielo" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 9HG344VX7Z;/g; s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'DEVELOPMENT_TEAM = 9HG344VX7Z' ios/App/App.xcodeproj/project.pbxproj || sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = 9HG344VX7Z;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Meta (SDK Facebook, ATT, SKAdNetwork)
        run: |
          P=ios/App/App/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Add :FacebookAppID string 1195715893123623" $P || $B -c "Set :FacebookAppID 1195715893123623" $P
          $B -c "Add :FacebookClientToken string b1e3492963493f667e0d53c6f3d58daf" $P || $B -c "Set :FacebookClientToken b1e3492963493f667e0d53c6f3d58daf" $P
          $B -c "Add :FacebookDisplayName string Cielo Montréal" $P || true
          $B -c "Add :FacebookAutoLogAppEventsEnabled bool true" $P || true
          $B -c "Add :FacebookAdvertiserIDCollectionEnabled bool true" $P || true
          $B -c "Add :NSUserTrackingUsageDescription string Permet de vous montrer des offres Cielo pertinentes." $P || true
          $B -c "Add :CFBundleURLTypes array" $P || true
          $B -c "Add :CFBundleURLTypes:0 dict" $P
          $B -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $P
          $B -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string fb1195715893123623" $P
          $B -c "Add :LSApplicationQueriesSchemes array" $P || true
          for s in fbapi fbauth2 fbshareextension fb-messenger-share-api; do $B -c "Add :LSApplicationQueriesSchemes:0 string $s" $P; done
          $B -c "Add :SKAdNetworkItems array" $P || true
          for k in v9wttpbfk9.skadnetwork n38lu8286q.skadnetwork; do
            $B -c "Add :SKAdNetworkItems:0 dict" $P
            $B -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string $k" $P
          done
          plutil -lint $P && plutil -p $P | head -80
      - name: Notifications push (APNs)
        run: |
          cat > ios/App/App/App.entitlements <<'X'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          X
          sed -i '' 's/^ *//' ios/App/App/App.entitlements
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = ca.cielomontreal.commande;/PRODUCT_BUNDLE_IDENTIFIER = ca.cielomontreal.commande; CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' ios/App/App.xcodeproj/project.pbxproj
          grep -c "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj
          python3 - <<'PY'
          p='ios/App/App/AppDelegate.swift';s=open(p).read()
          if 'didRegisterForRemoteNotificationsWithDeviceToken' not in s:
              add='''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }
              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          }
          '''
              i=s.rstrip().rfind('}');s=s[:i]+add;open(p,'w').write(s)
          print('AppDelegate OK')
          PY
      - name: Localisation (zone Cielo)
        run: |
          P=ios/App/App/Info.plist; B=/usr/libexec/PlistBuddy
          $B -c "Add :NSLocationWhenInUseUsageDescription string Pour vous avertir des offres quand vous êtes près de Cielo." $P || true
          $B -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Pour vous avertir des offres quand vous passez près de Cielo, même quand l'app est fermée. Votre position n'est jamais envoyée à Cielo." $P || true
          python3 - <<'PY'
          p='ios/App/App/AppDelegate.swift';s=open(p).read()
          if 'CieloZone' not in s:
              s=s.replace('didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {','didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {\n        CieloZone.shared.demarrer()',1)
              s+='\n'+open('ios-zone.swift').read()
              open(p,'w').write(s)
          print('zone OK', 'CieloZone.shared.demarrer' in s)
          PY
      - name: Clé App Store Connect
        env: { ASC_KEY_P8: "${{ secrets.ASC_KEY_P8 }}", ASC_KEY_ID: "${{ secrets.ASC_KEY_ID }}" }
        run: |
          mkdir -p ~/private_keys
          python3 - <<'PY'
          import os,re,base64,textwrap
          raw=os.environ['ASC_KEY_P8'].strip()
          body=re.sub(r'\s+','',re.sub(r'-----(BEGIN|END)[^-]*-----','',raw))
          if not body.startswith('MIG'):
              try: body=re.sub(r'\s+','',re.sub(r'-----(BEGIN|END)[^-]*-----','',base64.b64decode(body).decode()))
              except Exception: pass
          pem='-----BEGIN PRIVATE KEY-----\n'+'\n'.join(textwrap.wrap(body,64))+'\n-----END PRIVATE KEY-----\n'
          open(os.path.expanduser('~/private_keys/AuthKey_'+os.environ['ASC_KEY_ID']+'.p8'),'w').write(pem)
          print('cle ecrite,', len(body), 'caracteres base64')
          PY
          openssl pkey -in ~/private_keys/AuthKey_$ASC_KEY_ID.p8 -noout && echo "PEM valide"
      - name: Compilation + envoi TestFlight (fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: fastlane ios beta
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-build, path: build, if-no-files-found: ignore }
