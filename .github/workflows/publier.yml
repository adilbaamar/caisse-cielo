# Publie sur l'App Store la version approuvée par Apple (« En attente de publication par le développeur »).
# Lancement manuel seulement. Tourne sur Linux (pas besoin de Mac).
name: Publier la version approuvée
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. 1.1)"
        required: true
        default: "1.1"
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Publier via l'API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os,re,base64,textwrap,time,jwt,requests,sys
          raw=os.environ['ASC_KEY_P8'].strip()
          body=re.sub(r'\s+','',re.sub(r'-----(BEGIN|END)[^-]*-----','',raw))
          if not body.startswith('MIG'):
              try: body=re.sub(r'\s+','',re.sub(r'-----(BEGIN|END)[^-]*-----','',base64.b64decode(body).decode()))
              except Exception: pass
          pem='-----BEGIN PRIVATE KEY-----\n'+'\n'.join(textwrap.wrap(body,64))+'\n-----END PRIVATE KEY-----\n'
          now=int(time.time())
          tok=jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':now,'exp':now+900,'aud':'appstoreconnect-v1'},pem,algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
          H={'Authorization':'Bearer '+tok,'Content-Type':'application/json'}
          A='https://api.appstoreconnect.apple.com/v1'
          r=requests.get(A+'/apps/6834131132/appStoreVersions',params={'filter[versionString]':os.environ['VERSION'],'filter[platform]':'IOS'},headers=H).json()
          if not r.get('data'): print('Version introuvable',r); sys.exit(1)
          v=r['data'][0]; st=v['attributes']['appStoreState']; print('Version',os.environ['VERSION'],'état :',st)
          if st=='READY_FOR_SALE': print('Déjà publiée.'); sys.exit(0)
          if st!='PENDING_DEVELOPER_RELEASE': print('Pas encore prête à publier.'); sys.exit(1)
          p=requests.post(A+'/appStoreVersionReleaseRequests',headers=H,json={'data':{'type':'appStoreVersionReleaseRequests','relationships':{'appStoreVersion':{'data':{'type':'appStoreVersions','id':v['id']}}}}})
          print('Publication :',p.status_code,p.text[:300])
          sys.exit(0 if p.status_code in (200,201) else 1)
          PY
